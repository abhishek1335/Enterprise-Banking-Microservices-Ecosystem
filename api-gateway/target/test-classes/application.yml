server:
  port: 0

spring:
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:9991
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    enabled: false

banking:
  jwt:
    secret: test-secret-key-minimum-32-characters-long-hs256
    issuer: banking-system
    public-paths:
      - /api/v1/auth/login
      - /actuator/health
  rate-limit:
    enabled: false
