server:
  port: 8085

spring:
  application:
    name: fraud-detection-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/banking_fraud
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detection-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.banking.common.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

banking:
  jwt:
    secret: ${JWT_SECRET:change-me-use-32-char-minimum-secret-key-for-hs256-banking}
    issuer: ${JWT_ISSUER:banking-system}
  fraud:
    high-amount-threshold: ${FRAUD_HIGH_AMOUNT_THRESHOLD:5000}
    velocity-window-minutes: ${FRAUD_VELOCITY_WINDOW_MINUTES:5}
    velocity-max-transfers: ${FRAUD_VELOCITY_MAX_TRANSFERS:3}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.banking.fraud: DEBUG
    org.springframework.kafka: INFO
