spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:banking_account;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

eureka:
  client:
    enabled: false

banking:
  jwt:
    secret: test-secret-key-minimum-32-characters-long-hs256
    issuer: banking-system
