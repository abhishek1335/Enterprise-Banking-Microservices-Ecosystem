spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:banking_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

eureka:
  client:
    enabled: false

banking:
  jwt:
    secret: test-secret-key-minimum-32-characters-long-hs256
    issuer: banking-system
    expiration-ms: 3600000
